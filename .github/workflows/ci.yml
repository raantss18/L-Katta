name: Intégration continue

# Tests à chaque envoi sur main et à chaque demande de fusion ; à chaque étiquette de version (v*),
# l'AppImage est aussi fabriquée sur une machine propre et gardée comme artefact du flux (elle ne
# remplace pas celle de la version publiée, construite et vérifiée par son empreinte SHA-256).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'site/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dépendances de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tests
        run: cargo test --locked
      - name: Avertissements du compilateur
        run: RUSTFLAGS="-D warnings" cargo build --locked

  appimage:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dépendances de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config libfuse2t64 || sudo apt-get install -y libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: L'étiquette correspond à la version de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Cargo.toml dit $v, l'étiquette ${GITHUB_REF_NAME}"; exit 1; }
      - name: Fabriquer l'AppImage
        run: |
          out="$(bash scripts/appimage.sh | tail -n1)"
          sha256sum "$out" | tee "$out.sha256"
          "$out" --appimage-extract-and-run version || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LKatta-AppImage
          path: dist/*
          if-no-files-found: error
